<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 8px;
  }

  .widget {
    width: 400px;
    height: 400px;
    max-width: 100%;
    max-height: 100%;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: #FDFCFA;
    border: 0.5px solid rgba(0, 0, 0, 0.07);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.04);
  }

  .glass-card {
    position: absolute;
    inset: 0;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .greeting {
    font-size: 20px;
    font-weight: 500;
    color: #4A4D55;
    line-height: 1.2;
  }
  .wish {
    font-size: 14px;
    color: #7A7E88;
    margin-top: 3px;
  }
  .date {
    font-size: 12px;
    color: #A0A4AC;
    margin-top: 6px;
  }

  .illustration {
    margin-top: -8px;
    margin-right: -6px;
    width: 130px;
    height: 100px;
    flex-shrink: 0;
  }

  .main-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 6px;
  }

  .time {
    font-size: 82px;
    font-weight: 300;
    color: #4A4D55;
    line-height: 1;
    letter-spacing: -0.04em;
    font-feature-settings: 'tnum';
  }

  .temp-block {
    text-align: right;
    padding-bottom: 6px;
  }
  .temp-row {
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .temp {
    font-size: 36px;
    font-weight: 300;
    color: #4A4D55;
    line-height: 1;
    letter-spacing: -0.02em;
    font-feature-settings: 'tnum';
  }
  .temp-unit {
    font-size: 14px;
    color: #7A7E88;
    margin-top: 4px;
    margin-left: 2px;
  }
  .city {
    font-size: 11px;
    color: #7A7E88;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }

  .forecast {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-top: 14px;
    padding: 12px 0;
    border-top: 0.5px solid rgba(74, 77, 85, 0.1);
    border-bottom: 0.5px solid rgba(74, 77, 85, 0.1);
  }
  .forecast-day { text-align: center; }
  .day-name {
    font-size: 10px;
    color: #7A7E88;
    letter-spacing: 0.06em;
  }
  .day-icon {
    margin: 3px auto;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .day-temp {
    font-size: 11px;
    color: #4A4D55;
    font-feature-settings: 'tnum';
    margin-top: 2px;
  }

  .quote-block {
    margin-top: auto;
    padding-top: 12px;
  }
  .quote-text {
    font-size: 16px;
    color: #6B6F78;
    line-height: 1.45;
  }
  .quote-author {
    font-size: 12px;
    color: #A0A4AC;
    margin-top: 4px;
    letter-spacing: 0.01em;
  }
</style>
</head>

};

function pad2(n) { return n.toString().padStart(2, '0'); }

function getIconKey(code) {
  return ICON_MAP[code] || 'cloudy';
}

function updateGreeting() {
  const now = new Date();
  const h = now.getHours();
  let g;
  if (h < 5) g = 'Dobranoc';
  else if (h < 12) g = 'Dzień dobry';
  else if (h < 18) g = 'Cześć';
  else if (h < 22) g = 'Dobry wieczór';
  else g = 'Dobranoc';
  document.getElementById('greeting').textContent = NAME ? g + ', ' + NAME : g;
  document.getElementById('wish').textContent = ZYCZENIA[now.getDay()];
}

function updateDate() {
  const now = new Date();
  document.getElementById('date').textContent =
    now.getDate() + ' ' + MIESIACE[now.getMonth()] + ' ' + now.getFullYear();
}

function updateTime() {
  const now = new Date();
  document.getElementById('time').textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
}

function updateQuote() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  const slotsPerDay = Math.floor(24 / QUOTE_ROTATION_HOURS);
  const hourSlot = Math.floor(now.getHours() / QUOTE_ROTATION_HOURS);
  const idx = (dayOfYear * slotsPerDay + hourSlot) % QUOTES.length;
  const q = QUOTES[idx];
  document.getElementById('quote-text').textContent = q.text;
  const authorEl = document.getElementById('quote-author');
  authorEl.textContent = q.author ? '— ' + q.author : '';
}

async function updateWeather() {
  try {
    const url = 'https://api.openweathermap.org/data/2.5/weather' +
                '?lat=' + LATITUDE + '&lon=' + LONGITUDE +
                '&appid=' + encodeURIComponent(OPENWEATHER_API_KEY) +
                '&units=metric&lang=pl';
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const temp = Math.round(data.main.temp);
    const iconKey = getIconKey(data.weather[0].icon);
    document.getElementById('temp').textContent = temp;
    document.getElementById('city').textContent = CITY.toUpperCase();
    document.getElementById('illustration').innerHTML = LARGE_ICONS[iconKey];
  } catch (e) {
    document.getElementById('illustration').innerHTML = LARGE_ICONS.sun_cloud;
  }
}

async function updateForecast() {
  try {
    const url = 'https://api.openweathermap.org/data/2.5/forecast' +
                '?lat=' + LATITUDE + '&lon=' + LONGITUDE +
                '&appid=' + encodeURIComponent(OPENWEATHER_API_KEY) +
                '&units=metric&lang=pl';
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const todayStr = new Date().toDateString();
    const byDay = {};
    data.list.forEach(item => {
      const d = new Date(item.dt * 1000);
      const key = d.toDateString();
      if (key === todayStr) return;
      if (!byDay[key]) byDay[key] = { date: d, items: [] };
      byDay[key].items.push(item);
    });

    const days = Object.values(byDay).slice(0, 5).map(day => {
      let best = day.items[0];
      let bestDiff = Math.abs(new Date(best.dt * 1000).getHours() - 12);
      for (const it of day.items) {
        const diff = Math.abs(new Date(it.dt * 1000).getHours() - 12);
        if (diff < bestDiff) { best = it; bestDiff = diff; }
      }
      return {
        date: day.date,
        temp: Math.round(best.main.temp),
        iconKey: getIconKey(best.weather[0].icon)
      };
    });

    const forecastEl = document.getElementById('forecast');
    forecastEl.innerHTML = days.map(d => `
      <div class="forecast-day">
        <div class="day-name">${DNI_SKROT[d.date.getDay()]}</div>
        <div class="day-icon">${SMALL_ICONS[d.iconKey]}</div>
        <div class="day-temp">${d.temp}°</div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('forecast').innerHTML = '';
  }
}

function tick() {
  updateTime();
  updateGreeting();
  updateDate();
  updateQuote();
}

tick();
updateWeather();
updateForecast();

setInterval(tick, 60 * 1000);
setInterval(updateWeather, 30 * 60 * 1000);
setInterval(updateForecast, 60 * 60 * 1000);
</script>
